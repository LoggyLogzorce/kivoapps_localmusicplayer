    function visualize(timestamp){
        requestAnimationFrame(visualize);
        if (performanceMode) return;
        if (timestamp - lastFrameTime < 1000 / currentFPS) return;
        lastFrameTime = timestamp;
        if (pendingResize) { pendingResize = false; applyResize(); }
        canvasCtx.save();
        canvasCtx.setTransform(1,0,0,1,0,0);
        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
        canvasCtx.restore();
        canvasCtx.shadowBlur = 0;
        const isPlaying = !audio.paused && audioCtx !== null;
        if(isPlaying){ visualizerEnergy += (1 - visualizerEnergy) * 0.08; }
        else { visualizerEnergy += (0 - visualizerEnergy) * 0.04; }
        if (!isPlaying) {
            smoothPower += (5 - smoothPower) * 0.06;
            if (smoothFrequency.length > 0) for(let i = 0; i < smoothFrequency.length; i++) smoothFrequency[i] *= 0.92;
        } else {
            for(let i = 0; i < dataArray.length; i++) smoothFrequency[i] += (dataArray[i] - smoothFrequency[i]) * 0.12;
        }
        let glowTick = 0;
        
        if ((glowTick++ & 1) === 0) {
            updateGlow(isPlaying);
        }
        analyser.getByteFrequencyData(dataArray);
        let bass = 0;
        for(let i = 0; i < 20; i++) bass += dataArray[i];
        bass /= 20;
        const beat = bass > 180 ? 25 : 0;
        const targetPower = 8 + Math.pow(bass / 255, 2) * 80 + beat;
        smoothPower += (targetPower - smoothPower) * 0.08;
        const waveMultiplier = lyricsMode ? 0.6 : 1;
        drawWave(smoothPower * waveMultiplier);
        canvasCtx.save();
        canvasCtx.globalAlpha = visualizerEnergy;
        drawParticles();
        drawFrequencyBars();
        canvasCtx.restore();
    }

    const toggleSidebarBtn = document.getElementById('toggle-sidebar');
    toggleSidebarBtn.addEventListener('click', () => document.body.classList.toggle('sidebar-hidden'));

    function playTrack(file, opts = {}) {
        const globalIdx = tracks.indexOf(file);
        if (globalIdx === -1) return;

        // ── Завершаем предыдущий трек ──
        if (currentTrackGlobalIndex !== -1) {
            const prev = tracks[currentTrackGlobalIndex];
            const natural = isFinite(audio.duration) && audio.duration > 0
                && audio.currentTime >= audio.duration - 0.5;
            RecoEngine.onTrackStopped(prev, audio.currentTime, natural);
        }

        initAudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentTrackGlobalIndex = globalIdx;
        sessionPlayed.add(RecoEngine.key(file));
        kivoRememberPlayed(globalIdx);
        forceTrackRender = true;
        renderVisibleTracks();
        currentObjectUrl = URL.createObjectURL(file);
        audio.src = currentObjectUrl;
        playerTrackTitle.textContent = file.parsedTitle;
        playerTrackArtists.innerHTML = '';
        playerTrackArtists.appendChild(createArtistsHtml(file.parsedArtists));
        currentTrackExt.textContent = getTrackExt(file);
        updateCurrentGenreBadge();
        extractCover(file);
        updateLyricsButton(file);
        loadLyrics(file);
        renderVisibleTracks();
        // play() может быть прерван новой загрузкой src — не даём всплыть unhandled rejection
        audio.play().catch(() => {});

        if (waveMode) {
            const k = RecoEngine.key(file);
            const stat = RecoEngine.stats.get(k);
            voteState = stat ? (stat.vote || 0) : 0;
            renderVote();
            RecoEngine.onTrackStarted(file, opts);
        }
    }

    let lyricsLoadToken = 0;

    function resetLyricsView(){
        lyricsText.innerHTML = "";
        currentLyric = -1;
        lyricsContainer.style.display = "block";
    }

    // Единая точка отрисовки текста: и для тега, и для .lrc, и для ручной правки.
    // origin: 'edit' | 'tag' | 'lrc' | 'none'
    function applyLyrics(file, rawText, origin){
        const text = String(rawText || "");
        if(origin !== 'edit') file.lyricsOriginal = text;
        file.lyricsSource  = origin;
        file.lyricsCurrent = text;

        const parsed = parseLrc(text);
        file.lyricsTimed  = parsed.timed && parsed.lines.length > 0;
        file.lyricsParsed = parsed.lines;

        resetLyricsView();

        if(parsed.timed && parsed.lines.length){
            renderTimedLyrics(parsed.lines);
        } else if(text.trim()){
            showLyrics(text);
        } else {
            setLyricsMode(false);
            const empty = document.createElement("div");
            empty.className = "lyric-line";
            empty.style.cssText = "font-size:20px;color:#5a5a5a";
            empty.textContent = "Текст отсутствует — нажмите «＋ Добавить текст», чтобы вставить его";
            lyricsText.appendChild(empty);
        }

        updateLyricsButton(file);
    }

    async function loadLyrics(file){
        const token = ++lyricsLoadToken;

        // 1. ручная правка, уже поднятая в память
        if(file.lyricsEdited != null){
            applyLyrics(file, file.lyricsEdited, 'edit');
            return;
        }

        // 2. ручная правка из IndexedDB (переживает перезапуск плеера)
        let edit = null;
        try { edit = await loadLyricsEdit(lyricsKeyFor(file)); } catch(_) {}
        if(token !== lyricsLoadToken || tracks[currentTrackGlobalIndex] !== file) return;
        if(edit && edit.lrcText != null){
            file.lyricsEdited = edit.lrcText;
            if(file.lyricsOriginal == null && edit.originalText != null) file.lyricsOriginal = edit.originalText;
            applyLyrics(file, edit.lrcText, 'edit');
            return;
        }

        // 3. текст из метаданных (USLT)
        if(file.lyrics){
            applyLyrics(file, file.lyrics, 'tag');
            return;
        }

        // 4. соседний .lrc
        if(file.lrcFile){
            const lrc = await loadLrc(file.lrcFile);
            if(token !== lyricsLoadToken || tracks[currentTrackGlobalIndex] !== file) return;
            if(lrc && String(lrc).trim()){
                applyLyrics(file, lrc, 'lrc');
                return;
            }
        }

        applyLyrics(file, '', 'none');
    }

    // Поиск без побочных эффектов: только считает список, ничего не рендерит
    // треки, чей жанр назван в запросе: «рок» должен находить рок, а не «Пророк»
    function genreQueryTracks(q) {
        const G = window.KivoGenres;
        if (!G || !q) return [];
        const ids = G.detect(q);
        if (!ids.length) return [];
        return tracks.filter(f => (f.genres || []).some(g => ids.includes(g)));
    }

    // и не трогает filteredTracks. Нужен и executeSearch, и голосовому помощнику.
    function searchTracks(query) {
        const q = (query || '').toLowerCase().trim();

        if (!q) return [...tracks];

        const byGenre = genreQueryTracks(q);

        if (typeof Fuse === 'undefined') {
            // fallback без Fuse
            const swapped = layoutSwap(q);
            const queries = [q, transliterate(q)];
            if (swapped) queries.push(swapped, transliterate(swapped));

            const rest = tracks.filter(file => {
                const hay = (file.parsedTitle + ' ' + file.parsedArtists.join(' ') + ' ' +
                    (file.genres || []).map(genreLabel).join(' ')).toLowerCase();
                const hayT = transliterate(hay);
                return queries.some(v => hay.includes(v) || hayT.includes(v));
            });
            return byGenre.length
                ? byGenre.concat(rest.filter(f => !byGenre.includes(f)))
                : rest;
        }

        ensureFuseIndex();

        // Собираем все варианты запроса
        const queries = new Set();
        queries.add(q);
        queries.add(transliterate(q));

        const swapped = layoutSwap(q);
        if (swapped) {
            queries.add(swapped);
            queries.add(transliterate(swapped));
        }

        const scores = new Map();
        for (const variant of queries) {
            for (const r of fuse.search(variant)) {
                const prev = scores.get(r.item);
                if (prev === undefined || r.score < prev) scores.set(r.item, r.score);
            }
        }

        const found = [...scores.entries()]
            .sort((a, b) => a[1] - b[1])
            .map(e => e[0]);

        if (!byGenre.length) return found;

        const seen = new Set(byGenre);
        return byGenre.concat(found.filter(f => !seen.has(f)));
    }

    // поиск + фильтр по жанру — одна точка, чтобы они не спорили друг с другом
    function applyFilters(query) {
        const q = (query === undefined) ? searchInput.value : query;
        let list = searchTracks(q);
        if (activeGenre) list = list.filter(f => (f.genres || []).includes(activeGenre));

        filteredTracks = list;
        renderPlaylist();
        trackListContainer.scrollTop = 0;
        forceTrackRender = true;
        renderVisibleTracks();
    }

    function executeSearch(query) {
        // новый поиск — старый фильтр по жанру больше не актуален
        if (activeGenre) { activeGenre = null; renderGenreMenu(); }
        applyFilters(query);
    }

    // ══════════════════════════════════════════════════════
    //  ЖАНРЫ
    //  Справочник жанров и разбор тегов — в genres.js (общий с
    //  голосовым помощником). Здесь: определение жанра для файла,
    //  полоса фильтров, бейдж в карточке и фоновое чтение тегов.
    // ══════════════════════════════════════════════════════
    const genreBtn = document.getElementById('genre-btn');
    const genreBtnLabel = document.getElementById('genre-btn-label');
    const genrePop = document.getElementById('genre-pop');
    const genrePopList = document.getElementById('genre-pop-list');
    const genreReset = document.getElementById('genre-reset');
    const currentTrackGenre = document.getElementById('current-track-genre');

    let genrePopOpen = false;

    function genreLabel(id) {
        return (window.KivoGenres && id) ? window.KivoGenres.label(id) : String(id || '');
    }

    // жанр без чтения тегов: сначала папка, потом исполнитель
    function genreForFile(file) {
        const G = window.KivoGenres;
        if (!G) return { list: [], src: '' };

        const path = file._path || file.webkitRelativePath || '';
        const fromFolder = G.detectFolder(path);
        if (fromFolder.length) return { list: fromFolder, src: 'folder' };

        for (const a of (file.parsedArtists || [])) {
            const g = G.detectArtist(a);
            if (g) return { list: [g], src: 'artist' };
        }
        return { list: [], src: '' };
    }

    function genreCounts() {
        const map = new Map();
        for (const f of tracks) {
            for (const g of (f.genres || [])) map.set(g, (map.get(g) || 0) + 1);
        }
        return [...map.entries()].sort((a, b) =>
            (b[1] - a[1]) || genreLabel(a[0]).localeCompare(genreLabel(b[0]), 'ru'));
    }

    function renderGenreMenu() {
        const list = genreCounts();

        // выбранного жанра больше нет в библиотеке
        if (activeGenre && !list.some(([id]) => id === activeGenre)) activeGenre = null;

        if (genrePopList) {
            genrePopList.innerHTML = '';
            if (list.length) {
                const addChip = (label, count, id, all) => {
                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.className = 'genre-chip'
                        + (all ? ' is-all' : '')
                        + (id === activeGenre ? ' active' : '');
                    chip.dataset.genre = id || '';

                    const t = document.createElement('span');
                    t.className = 'gc-t';
                    t.textContent = label;
                    const n = document.createElement('span');
                    n.className = 'gc-n';
                    n.textContent = count;

                    chip.append(t, n);
                    chip.addEventListener('click', () => setGenreFilter(id));
                    genrePopList.appendChild(chip);
                };

                addChip('Все', tracks.length, null, true);
                for (const [id, n] of list) addChip(genreLabel(id), n, id, false);
            }
        }

        if (genreReset) genreReset.hidden = !activeGenre;
        updateGenreButton(list);
    }

    function updateGenreButton(list) {
        if (!genreBtn) return;
        const n = list ? list.length : 0;
        genreBtn.hidden = n === 0;
        if (!n) { closeGenrePop(); return; }

        const hit = activeGenre ? list.find(([id]) => id === activeGenre) : null;
        genreBtnLabel.textContent = activeGenre ? genreLabel(activeGenre) : 'Жанры';
        genreBtn.classList.toggle('is-active', !!activeGenre);
        genreBtn.title = activeGenre
            ? `Жанр: ${genreLabel(activeGenre)}${hit ? ' · ' + hit[1] + ' треков' : ''} — нажмите, чтобы сменить`
            : `Жанров: ${n} — фильтр по жанру`;
    }

    // ── открытие/закрытие меню ──
    // position: fixed — иначе меню обрежется overflow:hidden сайдбара
    function positionGenrePop() {
        if (!genrePop || !genreBtn) return;

        const r = genreBtn.getBoundingClientRect();
        const w = Math.min(320, Math.max(240, window.innerWidth - 24));
        const maxH = Math.min(Math.round(window.innerHeight * 0.62), 480);

        let left = Math.min(r.left, window.innerWidth - w - 12);
        left = Math.max(12, left);

        const below = window.innerHeight - r.bottom - 12;
        const above = r.top - 12;

        let top, h;
        if (below < 200 && above > below) {
            h = Math.min(maxH, above);
            top = r.top - h - 8;
        } else {
            h = Math.min(maxH, below);
            top = r.bottom + 8;
        }

        genrePop.style.width = w + 'px';
        genrePop.style.left = left + 'px';
        genrePop.style.top = Math.max(8, top) + 'px';
        genrePop.style.maxHeight = Math.max(140, h) + 'px';
    }

    function openGenrePop() {
        if (!genrePop || !genreBtn || genreBtn.hidden) return;
        renderGenreMenu();
        genrePop.hidden = false;
        genrePopOpen = true;
        genreBtn.classList.add('is-open');
        genreBtn.setAttribute('aria-expanded', 'true');
        positionGenrePop();

        const act = genrePopList && genrePopList.querySelector('.genre-chip.active');
        if (act) act.scrollIntoView({ block: 'nearest' });
    }

    function closeGenrePop() {
        if (!genrePop || !genrePopOpen) return;
        genrePop.hidden = true;
        genrePopOpen = false;
        if (genreBtn) {
            genreBtn.classList.remove('is-open');
            genreBtn.setAttribute('aria-expanded', 'false');
        }
    }

    function toggleGenrePop() {
        if (genrePopOpen) closeGenrePop();
        else openGenrePop();
    }

    if (genreBtn) {
        genreBtn.addEventListener('click', () => toggleGenrePop());
        document.addEventListener('mousedown', (e) => {
            if (!genrePopOpen) return;
            if (genrePop.contains(e.target) || genreBtn.contains(e.target)) return;
            closeGenrePop();
        });
        document.addEventListener('keydown', (e) => {
            if (!genrePopOpen || e.key !== 'Escape') return;
            closeGenrePop();
            e.stopPropagation();
        }, true);
        window.addEventListener('resize', () => { if (genrePopOpen) positionGenrePop(); });
    }

    if (genreReset) {
        genreReset.addEventListener('click', () => setGenreFilter(null));
    }

    function setGenreFilter(id, toggle = true) {
        activeGenre = (toggle && activeGenre === id) ? null : id;
        if (activeGenre) {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
        }
        applyFilters('');
        renderGenreMenu();
        closeGenrePop();
        if (activeGenre && document.body.classList.contains('sidebar-hidden')) {
            document.body.classList.remove('sidebar-hidden');
        }
    }

    function updateCurrentGenreBadge() {
        if (!currentTrackGenre) return;
        const file = tracks[currentTrackGlobalIndex];
        const gid = file && (file.genres || [])[0];

        currentTrackGenre.hidden = !gid;
        currentTrackGenre.textContent = gid ? genreLabel(gid) : '';
        if (!gid) { currentTrackGenre.removeAttribute('title'); return; }

        const src = file.genreSrc === 'tag'
            ? (file.genresRaw ? `тег: ${file.genresRaw}` : 'из тега файла')
            : file.genreSrc === 'folder' ? 'по папке'
            : 'по исполнителю';
        currentTrackGenre.title = `Жанр ${genreLabel(gid)} (${src}) — нажмите, чтобы показать все треки жанра`;
    }

    if (currentTrackGenre) {
        currentTrackGenre.addEventListener('click', () => {
            const file = tracks[currentTrackGlobalIndex];
            const gid = file && (file.genres || [])[0];
            if (!gid) return;
            // бейдж всегда показывает жанр, а не переключает фильтр
            setGenreFilter(gid, false);
        });
    }

    // фоновое чтение тегов: у файлов с ID3-жанром он точнее папки и исполнителя
    let genreScanToken = 0;

    function readGenreTag(file, cb) {
        let done = false;
        const finish = () => { if (done) return; done = true; file.genreScanned = true; cb(); };
        try {
            window.jsmediatags.read(file, {
                onSuccess: (tag) => {
                    const raw = tag && tag.tags && tag.tags.genre;
                    const ids = (raw != null && window.KivoGenres) ? window.KivoGenres.fromTag(raw) : [];
                    if (ids.length) {
                        file.genres = ids;
                        file.genresRaw = String(raw).trim();
                        file.genreSrc = 'tag';
                    }
                    finish();
                },
                onError: finish
            });
        } catch (_) { finish(); }
    }

    function scanGenres() {
        if (!window.jsmediatags || !window.KivoGenres) return;

        const token = ++genreScanToken;
        const queue = tracks.filter(f => !f.genreScanned);
        if (!queue.length) return;

        let i = 0;
        let done = 0;

        const flush = () => {
            if (token !== genreScanToken) return;
            fuseDirty = true;
            renderGenreMenu();
            forceTrackRender = true;
            renderVisibleTracks();
            updateCurrentGenreBadge();
        };

        const step = () => {
            if (token !== genreScanToken) return;
            if (i >= queue.length) { if (done) flush(); return; }
            readGenreTag(queue[i++], () => {
                done++;
                if (done % 12 === 0) flush();
                setTimeout(step, 25);
            });
        };

        // не мешаем первому треку загрузиться и отрисоваться
        setTimeout(step, 700);
    }

    // ══════════════════════════════════════════════════════
    //  МОСТ ДЛЯ ГОЛОСОВОГО ПОМОЩНИКА
    //  Помощник живёт в отдельном файле и не умеет работать с File напрямую.
    //  Здесь он получает доступ к медиатеке: список треков, исполнители,
    //  поиск без побочных эффектов, история прослушивания и запуск по индексу.
    // ══════════════════════════════════════════════════════
    const KIVO_RECENT_MAX = 80;
    let kivoRecent = [];        // глобальные индексы, последний — в конце

    function kivoRememberPlayed(idx) {
        if (idx == null || idx < 0) return;
        const at = kivoRecent.indexOf(idx);
        if (at !== -1) kivoRecent.splice(at, 1);
        kivoRecent.push(idx);
        if (kivoRecent.length > KIVO_RECENT_MAX) kivoRecent.shift();
    }

    function kivoNorm(s) {
        return String(s || '').toLowerCase().replace(/ё/g, 'е')
            .replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    }

    function kivoInfo(file, index) {
        return {
            index,
            title: file.parsedTitle || file.name.replace(/\.[^.]+$/, ''),
            artists: (file.parsedArtists || []).slice(),
            genres: (file.genres || []).slice(),
            genresRaw: file.genresRaw || '',
            genreSrc: file.genreSrc || '',
            file: file.name
        };
    }

    window.KivoLibrary = {
        version: 2,

        count: () => tracks.length,
        list: () => tracks.map((f, i) => kivoInfo(f, i)),

        current: () => (currentTrackGlobalIndex >= 0 && tracks[currentTrackGlobalIndex])
            ? kivoInfo(tracks[currentTrackGlobalIndex], currentTrackGlobalIndex)
            : null,

        // последние проигранные, свежие сначала
        recent: (n = 10) => kivoRecent.slice(-Math.max(1, n)).reverse()
            .map(i => (tracks[i] ? kivoInfo(tracks[i], i) : null))
            .filter(Boolean),

        // исполнители по частоте в библиотеке
        artists: () => {
            const map = new Map();
            for (const f of tracks) {
                for (const a of (f.parsedArtists || [])) {
                    const key = kivoNorm(a);
                    if (!key) continue;
                    const e = map.get(key);
                    if (e) e.count++;
                    else map.set(key, { name: a, key, count: 1 });
                }
            }
            return [...map.values()].sort((x, y) => y.count - x.count);
        },

        // все треки исполнителя; name — точное имя из artists()
        byArtist: (name) => {
            const key = kivoNorm(name);
            const out = [];
            tracks.forEach((f, i) => {
                if ((f.parsedArtists || []).some(a => kivoNorm(a) === key)) out.push(kivoInfo(f, i));
            });
            return out;
        },

        // жанры библиотеки по частоте: [{ id, label, count }]
        genres: () => genreCounts().map(([id, count]) => ({ id, label: genreLabel(id), count })),

        // все треки жанра; понимает и синонимы («роковое» → «рок»)
        byGenre: (name) => {
            const G = window.KivoGenres;
            const key = G ? G.norm(name) : String(name || '').toLowerCase().trim();
            if (!key) return [];

            const ids = new Set(G ? G.detect(name) : []);
            for (const f of tracks) {
                for (const g of (f.genres || [])) {
                    if ((G ? G.norm(g) : String(g).toLowerCase()) === key) ids.add(g);
                }
            }
            if (!ids.size) return [];

            const out = [];
            tracks.forEach((f, i) => {
                if ((f.genres || []).some(g => ids.has(g))) out.push(kivoInfo(f, i));
            });
            return out;
        },

        // показать в боковом списке только этот жанр
        filterByGenre: (name) => {
            const G = window.KivoGenres;
            const key = G ? G.norm(name) : String(name || '').toLowerCase().trim();
            const list = genreCounts();

            let hit = list.find(([id]) => (G ? G.norm(id) : String(id).toLowerCase()) === key);
            if (!hit && G) {
                const ids = G.detect(name);
                hit = list.find(([id]) => ids.includes(id));
            }
            if (!hit) return false;

            activeGenre = hit[0];
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            applyFilters('');
            renderGenreMenu();
            if (document.body.classList.contains('sidebar-hidden')) {
                document.body.classList.remove('sidebar-hidden');
            }
            return true;
        },

        // поиск как в строке поиска, но без изменения UI
        find: (q) => {
            const pos = new Map();
            tracks.forEach((f, i) => pos.set(f, i));
            return searchTracks(q)
                .map(f => (pos.has(f) ? kivoInfo(f, pos.get(f)) : null))
                .filter(Boolean);
        },

        // включить трек по глобальному индексу
        play: (index) => {
            const f = tracks[index];
            if (!f) return false;
            playTrack(f);
            return true;
        },

        // показать в боковом списке то же, что показал бы поиск
        filterBy: (q) => {
            const input = document.getElementById('search-input');
            if (input) input.value = q;
            executeSearch(q);
        }
    };

    function triggerSearch(artistName) {
        if (searchTimeout) clearTimeout(searchTimeout);
        searchInput.value = artistName;
        clearSearchBtn.style.display = 'block';
        if(document.body.classList.contains('sidebar-hidden')) document.body.classList.remove('sidebar-hidden');
        executeSearch(artistName.toLowerCase());
    }

    let currentLyric = -1;

    function updateKaraoke(time){
        if (!lyricsMode) {
            return
        }
        const file = tracks[currentTrackGlobalIndex];
        if(!file?.lyricsTimed) return;
        let index = -1;
        for(let i=0;i<file.lyricsParsed.length;i++){
            if(time >= file.lyricsParsed[i].time) index = i;
            else break;
        }
        if(index === currentLyric) return;
        currentLyric = index;
        file.lyricsParsed.forEach(line => line.element.classList.remove("active"));
        if(index >= 0){
            const el = file.lyricsParsed[index].element;
            el.classList.add("active");
            el.scrollIntoView({ behavior:"smooth", block:"center" });
        }
    }

    lyricsButton.addEventListener("click", () => setLyricsMode(!lyricsMode));
    lyricsClose.addEventListener("click", () => setLyricsMode(false));

    // Esc из режима текста (если не открыт редактор/настройки/волна)
    document.addEventListener('keydown', (e) => {
        if(e.key !== 'Escape' || !lyricsMode) return;
        if(lrcEditorState.el && lrcEditorState.el.classList.contains('open')) return;
        if(document.querySelector('.lrc-confirm-overlay')) return;
        if(document.body.classList.contains('wave-view-open')) return;
        const settingsModal = document.getElementById('settings-modal');
        if(settingsModal && settingsModal.style.display === 'flex') return;
        setLyricsMode(false);
    });

    // до загрузки трека под плеером одна кнопка — «Добавить текст»
    updateLyricsButton({});

    // ══════════════════════════════════════════════════════
    //  РУЧНОЙ РЕДАКТОР ТАЙМИНГОВ LRC
    //  Зачем: скачанный LRC может быть от другой версии трека
    //  или просто «плыть». Здесь строки можно перебрать руками,
    //  отметить время по плееру и сохранить правку.
    // ══════════════════════════════════════════════════════
    const lrcEditButton = document.getElementById('lyrics-edit-button');

    const lrcEditorState = {
        el: null,
        file: null,
        rows: [],              // [{ time: секунды, text: строка, el }]
        selected: 0,
        dirty: false,
        writeToDisk: true,
        confirmEl: null,
        subText: ''
    };

    function lrcFormatTime(seconds){
        const total = Math.max(0, Number(seconds) || 0);
        const cs = Math.round(total * 100);
        const m = Math.floor(cs / 6000);
        const rest = (cs % 6000) / 100;
        return String(m).padStart(2, '0') + ':' + rest.toFixed(2).padStart(5, '0');
    }

    function lrcParseTime(value){
        const raw = String(value || '').trim().replace(/^\[|\]$/g, '').replace(',', '.');
        if(!raw) return null;
        const mmss = raw.match(/^(\d{1,3}):(\d{1,2}(?:\.\d{1,3})?)$/);
        if(mmss) return Number(mmss[1]) * 60 + Number(mmss[2]);
        const onlySec = raw.match(/^(\d+(?:\.\d{1,3})?)$/);
        if(onlySec) return Number(onlySec[1]);
        return null;
    }

    // текст → строки редактора; пустые строки сохраняются как разделители
    function lrcParseToRows(text){
        const parsed = parseLrc(String(text || ''));
        if(parsed.lines.length){
            return parsed.lines.map(l => ({ time: l.time, text: l.text }));
        }
        const raw = String(text || '').split(/\r?\n/)
            .map(line => {
                // метатеги LRC вроде [ti:] / [ar:] не показываем,
                // а обычный текст в скобках ([Куплет]) оставляем как есть
                return line
                    .replace(/^\s*\[(?:ti|ar|al|by|offset|re|ve|length|au|tool):[^\]]*\]\s*/i, '')
                    .replace(/\s+$/, '');
            });
        // края обрезаем, а пустые строки внутри текста оставляем — это разрывы;
        // несколько пустых подряд склеиваем в один, чтобы не копить пустоту
        const rows = [];
        for(const line of raw){
            if(!line.trim() && rows.length && !rows[rows.length - 1].text) continue;
            rows.push({ time: 0, text: line });
        }
        while(rows.length && !rows[0].text) rows.shift();
        while(rows.length && !rows[rows.length - 1].text) rows.pop();
        return rows;
    }

    function lrcSerializeRows(rows, file){
        const list = rows.map(r => ({
            time: Math.max(0, Number(r.time) || 0),
            text: String(r.text || '').trim()
        }));

        // пустые строки-разделители сохраняем, но пустые края без времени — нет
        while(list.length && !list[0].text && list[0].time <= 0.0001) list.shift();
        while(list.length && !list[list.length - 1].text && list[list.length - 1].time <= 0.0001) list.pop();
        if(!list.length) return '';

        const anyTimed = list.some(r => r.time > 0.0001);
        if(!anyTimed){
            // текст без таймингов: пустая строка остаётся пустой строкой
            return list.map(r => r.text).join('\n') + '\n';
        }

        // пустая строка без времени ничего не разделяет — выбрасываем
        const sorted = list
            .filter(r => r.text || r.time > 0.0001)
            .sort((a, b) => a.time - b.time);

        const head = [];
        const sanitize = (value) => String(value || '').replace(/[[\]]/g, '').trim();
        if(file && file.parsedTitle) head.push('[ti:' + sanitize(file.parsedTitle) + ']');
        if(file && file.parsedArtists && file.parsedArtists.length){
            head.push('[ar:' + sanitize(file.parsedArtists.join(', ')) + ']');
        }
        head.push('[by:KivoPlayer]');

        return head.join('\n') + '\n' +
            sorted.map(r => '[' + lrcFormatTime(r.time) + ']' + r.text).join('\n') + '\n';
    }

    function lrcPluralLines(n){
        const n10 = n % 10;
        const n100 = n % 100;
        if(n10 === 1 && n100 !== 11) return 'строка';
        if(n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return 'строки';
        return 'строк';
    }

    function ensureLrcEditor(){
        if(lrcEditorState.el) return lrcEditorState.el;

        const root = document.createElement('div');
        root.id = 'lrc-editor';
        root.innerHTML = `
            <div class="lrc-editor-panel" role="dialog" aria-modal="true" aria-label="Редактор текста и таймингов">
                <div class="lrc-editor-head">
                    <div class="lrc-editor-head-text">
                        <div class="lrc-editor-title">Текст и тайминги</div>
                        <div class="lrc-editor-sub" id="lrc-editor-sub"></div>
                    </div>
                    <button class="lrc-close" id="lrc-editor-close" title="Закрыть (Esc)">✕</button>
                </div>
                <div class="lrc-transport">
                    <button class="lrc-play" id="lrc-play" title="Играть / пауза">▶</button>
                    <span class="lrc-time-now" id="lrc-time-now">0:00</span>
                    <input class="lrc-seek" id="lrc-seek" type="range" min="0" max="1000" step="1" value="0">
                    <span class="lrc-time-dur" id="lrc-time-dur">—</span>
                </div>
                <div class="lrc-editor-tools">
                    <button class="lrc-tool" id="lrc-add-line" title="Вставить строку после выделенной">＋ Строка</button>
                    <button class="lrc-tool" id="lrc-add-blank" title="Вставить пустую строку-разделитель (разрыв между куплетами)">＋ Пустая</button>
                    <button class="lrc-tool" id="lrc-add-text" title="Вставить готовый текст песни или LRC">＋ Текст</button>
                    <button class="lrc-tool" id="lrc-shift-back" title="Сдвинуть все строки на 0.5 с назад">− 0.5 с</button>
                    <button class="lrc-tool" id="lrc-shift-fwd" title="Сдвинуть все строки на 0.5 с вперёд">＋ 0.5 с</button>
                    <button class="lrc-tool" id="lrc-stamp" title="Поставить выделенной строке текущее время (Пробел)">⏱ Отметить</button>
                    <button class="lrc-tool" id="lrc-spread" title="Разложить строки без времени равномерно между размеченными строками (или от начала до конца трека)">⏲ Раскидать</button>
                    <button class="lrc-tool" id="lrc-reset" title="Вернуть исходный текст трека">↺ Оригинал</button>
                    <span class="lrc-status" id="lrc-status"></span>
                </div>
                <div class="lrc-paste" id="lrc-paste" hidden>
                    <textarea class="lrc-paste-area" id="lrc-paste-area"
                        placeholder="Вставьте текст песни целиком — одна строка станет одной строкой текста. Пустая строка — разрыв между куплетами. Готовый LRC с таймингами тоже подойдёт."></textarea>
                    <div class="lrc-paste-actions">
                        <span class="lrc-paste-hint">Ctrl+Enter — добавить · Esc — закрыть</span>
                        <div class="lrc-paste-buttons">
                            <button class="lrc-btn ghost" id="lrc-paste-cancel">Отмена</button>
                            <button class="lrc-btn ghost" id="lrc-paste-replace">Заменить текст</button>
                            <button class="lrc-btn primary" id="lrc-paste-add">Добавить</button>
                        </div>
                    </div>
                </div>
                <div class="lrc-editor-rows" id="lrc-editor-rows"></div>
                <div class="lrc-editor-foot">
                    <label class="lrc-check" id="lrc-write-wrap">
                        <input type="checkbox" id="lrc-write-disk">
                        записать .lrc рядом с треком
                    </label>
                    <span class="lrc-hint">Пробел — время выделенной строке · пустая строка разделяет куплеты</span>
                    <div class="lrc-foot-buttons">
                        <button class="lrc-btn ghost" id="lrc-cancel">Отмена</button>
                        <button class="lrc-btn primary" id="lrc-save">Сохранить</button>
                    </div>
                </div>
            </div>`;
        document.body.appendChild(root);
        lrcEditorState.el = root;

        const $ = (sel) => root.querySelector(sel);

        $('#lrc-editor-close').addEventListener('click', requestCloseLrcEditor);
        $('#lrc-cancel').addEventListener('click', requestCloseLrcEditor);
        $('#lrc-save').addEventListener('click', onLrcSaveClick);
        $('#lrc-add-line').addEventListener('click', () => addLrcRow());
        $('#lrc-add-blank').addEventListener('click', () => addLrcRow({ blank: true }));
        $('#lrc-shift-back').addEventListener('click', () => shiftAllLrcRows(-0.5));
        $('#lrc-shift-fwd').addEventListener('click', () => shiftAllLrcRows(0.5));
        $('#lrc-stamp').addEventListener('click', () => stampLrcLine(lrcEditorState.selected));
        $('#lrc-spread').addEventListener('click', spreadLrcTimes);
        $('#lrc-reset').addEventListener('click', resetLrcRowsToOriginal);

        $('#lrc-add-text').addEventListener('click', () => {
            const panel = root.querySelector('#lrc-paste');
            if(!panel.hidden){ closeLrcPaste(); return; }
            openLrcPaste();
        });
        $('#lrc-paste-cancel').addEventListener('click', closeLrcPaste);
        $('#lrc-paste-add').addEventListener('click', () => applyLrcPaste('append'));
        $('#lrc-paste-replace').addEventListener('click', () => applyLrcPaste('replace'));

        const pasteArea = root.querySelector('#lrc-paste-area');
        pasteArea.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
                e.preventDefault();
                applyLrcPaste('append');
            }
        });

        root.addEventListener('mousedown', (e) => {
            if(e.target === root) requestCloseLrcEditor();
        });

        $('#lrc-play').addEventListener('click', () => {
            if(audio.paused){
                if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
        });

        const seek = $('#lrc-seek');
        seek.addEventListener('input', () => {
            if(!isFinite(audio.duration) || audio.duration <= 0) return;
            audio.currentTime = (Number(seek.value) / 1000) * audio.duration;
            updateLrcTransport();
        });

        $('#lrc-write-disk').addEventListener('change', (e) => {
            lrcEditorState.writeToDisk = !!e.target.checked;
        });

        document.addEventListener('keydown', onLrcEditorKeydown);

        ['timeupdate', 'seeked', 'play', 'pause', 'loadedmetadata', 'durationchange', 'ended']
            .forEach(evt => audio.addEventListener(evt, () => updateLrcTransport()));

        return root;
    }

    function onLrcEditorKeydown(e){
        const st = lrcEditorState;
        if(!st.el || !st.el.classList.contains('open')) return;

        if(e.key === 'Escape'){
            e.preventDefault();
            if(st.confirmEl){ closeLrcConfirm(); return; }
            const pastePanel = st.el.querySelector('#lrc-paste');
            if(pastePanel && !pastePanel.hidden){ closeLrcPaste(); return; }
            requestCloseLrcEditor();
            return;
        }
        if(st.confirmEl) return;   // пока открыт диалог, пробел не отмечает строки
        if(e.code !== 'Space') return;

        const t = e.target;
        if(t && (t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        if(t && t.tagName === 'INPUT'){
            if(t.classList.contains('lrc-text-input')) return;      // в тексте пробел нужен
            if(t.type === 'checkbox' || t.type === 'range') return; // не мешаем чекбоксу и ползунку
        }

        e.preventDefault();
        stampLrcLine(st.selected);
    }

    async function openLrcEditor(){
        const file = tracks[currentTrackGlobalIndex];
        if(!file){
            showNotification('Сначала включите трек');
            return;
        }

        ensureLrcEditor();
        const st = lrcEditorState;
        const root = st.el;

        // .lrc читается асинхронно — дождёмся, чтобы редактор не открылся пустым
        if(file.lyricsCurrent == null && !file.lyricsEdited){
            try { await loadLyrics(file); } catch(_) {}
        }
        if(tracks[currentTrackGlobalIndex] !== file) return;

        st.file = file;
        st.dirty = false;
        st.selected = 0;

        const currentText = file.lyricsEdited != null
            ? file.lyricsEdited
            : (file.lyricsCurrent != null ? file.lyricsCurrent : (file.lyricsOriginal || ''));
        st.rows = lrcParseToRows(currentText);
        if(!st.rows.length) st.rows.push({ time: 0, text: '' });

        const sub = root.querySelector('#lrc-editor-sub');
        const sourceLabel = file.lyricsEdited != null ? 'ручная правка'
            : file.lyricsSource === 'tag' ? 'текст из тега'
            : file.lyricsSource === 'lrc' ? 'текст из .lrc'
            : currentText.trim() ? 'текст без таймингов'
            : 'текста нет';
        st.subText = file.parsedTitle + ' — ' + sourceLabel;
        sub.textContent = st.subText + ' · ' + st.rows.length + ' ' + lrcPluralLines(st.rows.length);

        const canWriteDisk = !!currentDirHandle;
        const wrap = root.querySelector('#lrc-write-wrap');
        const cb = root.querySelector('#lrc-write-disk');
        cb.disabled = !canWriteDisk;
        wrap.classList.toggle('disabled', !canWriteDisk);
        wrap.title = canWriteDisk
            ? 'Файл .lrc будет создан или перезаписан рядом с треком'
            : 'Папка открыта без доступа на запись — правка сохранится внутри приложения';
        cb.checked = canWriteDisk && st.writeToDisk;

        root.classList.add('open');
        document.body.classList.add('lrc-editor-open');
        closeLrcPaste();
        renderLrcRows();
        updateLrcStatus();
        updateLrcTransport();
        root.querySelector('#lrc-editor-rows').scrollTop = 0;

        // в треке нет ни текста, ни таймингов — сразу предлагаем вставить текст
        if(!currentText.trim()) openLrcPaste();
    }

    function closeLrcEditor(opts){
        const st = lrcEditorState;
        if(!st.el || !st.el.classList.contains('open')) return;
        closeLrcConfirm();
        closeLrcPaste();
        st.el.classList.remove('open');
        document.body.classList.remove('lrc-editor-open');
        st.file = null;
        st.rows = [];
        st.selected = 0;
        st.dirty = false;
        st.el.querySelector('#lrc-editor-rows').innerHTML = '';
    }

    // закрытие с проверкой несохранённых правок — своим диалогом, без системного confirm
    function requestCloseLrcEditor(){
        const st = lrcEditorState;
        if(!st.el || !st.el.classList.contains('open')) return;
        if(!st.dirty){
            closeLrcEditor({ force: true });
            return;
        }
        showLrcDiscardConfirm();
    }

    function showLrcDiscardConfirm(){
        const st = lrcEditorState;
        if(st.confirmEl) return;

        const overlay = document.createElement('div');
        overlay.className = 'lrc-confirm-overlay';
        overlay.innerHTML = `
            <div class="lrc-confirm" role="alertdialog" aria-modal="true">
                <div class="lrc-confirm-title">Закрыть без сохранения?</div>
                <div class="lrc-confirm-text">Изменения таймингов ещё не сохранены и будут потеряны.</div>
                <div class="lrc-confirm-actions">
                    <button class="lrc-btn ghost" id="lrc-confirm-back">Продолжить</button>
                    <button class="lrc-btn danger" id="lrc-confirm-discard">Выйти</button>
                </div>
            </div>`;
        document.body.appendChild(overlay);
        st.confirmEl = overlay;

        overlay.querySelector('#lrc-confirm-back').addEventListener('click', closeLrcConfirm);
        overlay.querySelector('#lrc-confirm-discard').addEventListener('click', () => {
            closeLrcConfirm();
            closeLrcEditor({ force: true });
        });
        overlay.addEventListener('mousedown', (e) => {
            if(e.target === overlay) closeLrcConfirm();
        });
        overlay.querySelector('#lrc-confirm-back').focus();
    }

    function closeLrcConfirm(){
        const st = lrcEditorState;
        if(!st.confirmEl) return;
        st.confirmEl.remove();
        st.confirmEl = null;
    }

    function lrcMiniButton(label, title, extraClass, onClick){
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lrc-mini' + (extraClass ? ' ' + extraClass : '');
        btn.textContent = label;
        btn.title = title;
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            onClick();
        });
        return btn;
    }

    function renderLrcRows(){
        const st = lrcEditorState;
        if(!st.el) return;
        const box = st.el.querySelector('#lrc-editor-rows');
        box.innerHTML = '';

        const sub = st.el.querySelector('#lrc-editor-sub');
        if(sub && st.subText){
            sub.textContent = st.subText + ' · ' + st.rows.length + ' ' + lrcPluralLines(st.rows.length);
        }

        st.rows.forEach((row, index) => {
            const rowEl = document.createElement('div');
            rowEl.className = 'lrc-row' + (index === st.selected ? ' selected' : '')
                + (row.text && row.text.trim() ? '' : ' is-empty');
            rowEl.dataset.index = String(index);

            const num = document.createElement('div');
            num.className = 'lrc-num';
            num.textContent = index + 1;
            num.title = 'Перейти к этой строке';
            num.addEventListener('click', () => {
                audio.currentTime = Math.max(0, row.time);
                audio.play().catch(() => {});
                selectLrcRow(index);
            });

            const time = document.createElement('input');
            time.type = 'text';
            time.className = 'lrc-time';
            time.spellcheck = false;
            time.value = lrcFormatTime(row.time);
            time.title = 'Время строки: мм:сс.сотые';
            time.addEventListener('focus', () => selectLrcRow(index, false));
            time.addEventListener('change', () => {
                const seconds = lrcParseTime(time.value);
                if(seconds === null){
                    time.classList.add('invalid');
                    return;
                }
                time.classList.remove('invalid');
                row.time = Math.round(seconds * 100) / 100;
                time.value = lrcFormatTime(row.time);
                markLrcDirty();
            });
            time.addEventListener('keydown', (e) => {
                if(e.key === 'Enter'){ e.preventDefault(); time.blur(); }
            });

            const text = document.createElement('input');
            text.type = 'text';
            text.className = 'lrc-text-input';
            text.spellcheck = false;
            text.placeholder = 'текст строки · пусто = разрыв';
            text.value = row.text;
            text.addEventListener('focus', () => selectLrcRow(index, false));
            text.addEventListener('input', () => {
                row.text = text.value;
                rowEl.classList.toggle('is-empty', !text.value.trim());
                markLrcDirty();
            });
            // вставка многострочного текста раскладывается на строки
            text.addEventListener('paste', (e) => onLrcRowPaste(e, index));
            text.addEventListener('keydown', (e) => {
                if(e.key === 'Enter'){
                    e.preventDefault();
                    const nextRow = st.rows[index + 1];
                    const nextInput = nextRow && nextRow.el && nextRow.el.querySelector('.lrc-text-input');
                    if(nextInput){
                        selectLrcRow(index + 1);
                        nextInput.focus();
                    } else {
                        text.blur();
                    }
                }
            });

            const actions = document.createElement('div');
            actions.className = 'lrc-row-actions';
            actions.appendChild(lrcMiniButton('⏱', 'Взять текущее время (Пробел)', 'stamp', () => stampLrcLine(index)));
            actions.appendChild(lrcMiniButton('✕', 'Удалить строку', 'danger', () => removeLrcRow(index)));

            rowEl.append(num, time, text, actions);
            rowEl.addEventListener('mousedown', (e) => {
                if(e.target.closest('input, button')) return;
                selectLrcRow(index);
            });

            row.el = rowEl;
            box.appendChild(rowEl);
        });
    }

    function selectLrcRow(index, scroll = true){
        const st = lrcEditorState;
        if(!st.rows.length) return;
        st.selected = Math.max(0, Math.min(index, st.rows.length - 1));
        st.el.querySelectorAll('.lrc-row').forEach((el, i) => {
            el.classList.toggle('selected', i === st.selected);
        });
        if(scroll){
            const el = st.rows[st.selected].el;
            if(el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
    }

    function stampLrcLine(index, opts){
        const st = lrcEditorState;
        const row = st.rows[index];
        if(!row) return;
        if(!isFinite(audio.currentTime)) return;
        // время берём у того трека, для которого открыт редактор
        if(st.file && tracks[currentTrackGlobalIndex] !== st.file){
            showNotification('Трек сменился — откройте редактор таймингов заново');
            return;
        }

        row.time = Math.max(0, Math.round(audio.currentTime * 100) / 100);
        const rowEl = row.el;
        if(rowEl){
            const input = rowEl.querySelector('.lrc-time');
            if(input){
                input.value = lrcFormatTime(row.time);
                input.classList.remove('invalid');
            }
            rowEl.classList.add('stamped');
            setTimeout(() => rowEl.classList.remove('stamped'), 450);
        }
        markLrcDirty();

        const advance = !(opts && opts.advance === false);
        if(advance && index + 1 < st.rows.length) selectLrcRow(index + 1);
        else selectLrcRow(index, false);
    }

    function addLrcRow(opts){
        const st = lrcEditorState;
        const blank = !!(opts && opts.blank);
        const rows = st.rows;
        const at = rows.length ? Math.min(rows.length, st.selected + 1) : 0;
        const prev = rows[at - 1];
        const next = rows[at];

        let time = Math.max(0, audio.currentTime || 0);
        if(prev){
            time = prev.time + 2;
            if(next && next.time > prev.time) time = prev.time + (next.time - prev.time) / 2;
        }

        rows.splice(at, 0, { time: Math.round(time * 100) / 100, text: '' });
        st.selected = at;
        renderLrcRows();
        markLrcDirty();

        if(blank){
            // пустая строка-разделитель: сразу переходим к следующей, чтобы не мешать набивать текст
            selectLrcRow(at + 1 < st.rows.length ? at + 1 : at);
            updateLrcStatus('добавлен разрыв между куплетами');
            return;
        }

        const input = rows[at].el && rows[at].el.querySelector('.lrc-text-input');
        if(input) input.focus();
    }

    function removeLrcRow(index){
        const st = lrcEditorState;
        if(!st.rows[index]) return;
        st.rows.splice(index, 1);
        if(!st.rows.length) st.rows.push({ time: 0, text: '' });
        st.selected = Math.min(index, st.rows.length - 1);
        renderLrcRows();
        markLrcDirty();
    }

    function shiftAllLrcRows(delta){
        const st = lrcEditorState;
        if(!st.rows.length) return;
        st.rows.forEach(row => {
            row.time = Math.max(0, Math.round((row.time + delta) * 100) / 100);
            const input = row.el && row.el.querySelector('.lrc-time');
            if(input){
                input.value = lrcFormatTime(row.time);
                input.classList.remove('invalid');
            }
        });
        markLrcDirty();
        updateLrcStatus((delta > 0 ? '+' : '−') + Math.abs(delta).toFixed(1) + ' с ко всем строкам');
    }

    function resetLrcRowsToOriginal(){
        const st = lrcEditorState;
        const file = st.file;
        if(!file) return;
        const original = file.lyricsOriginal || '';
        st.rows = lrcParseToRows(original);
        if(!st.rows.length) st.rows.push({ time: 0, text: '' });
        st.selected = 0;
        renderLrcRows();
        markLrcDirty();
        updateLrcStatus(original.trim() ? 'исходный текст восстановлен' : 'исходного текста нет');
    }

    // ══════════════════════════════════════════════════════
    //  ВСТАВКА ОБЫЧНОГО ТЕКСТА
    //  Текст можно вставить целиком в панель «＋ Текст» или
    //  прямо в поле строки — многострочная вставка разложится
    //  на строки редактора.
    // ══════════════════════════════════════════════════════
    function openLrcPaste(prefill){
        const st = lrcEditorState;
        if(!st.el) return;
        const panel = st.el.querySelector('#lrc-paste');
        const area = st.el.querySelector('#lrc-paste-area');
        if(!panel || !area) return;
        area.value = prefill || '';
        panel.hidden = false;
        area.focus();
        if(!prefill) area.setSelectionRange(area.value.length, area.value.length);
    }

    function closeLrcPaste(){
        const st = lrcEditorState;
        if(!st.el) return;
        const panel = st.el.querySelector('#lrc-paste');
        const area = st.el.querySelector('#lrc-paste-area');
        if(panel) panel.hidden = true;
        if(area) area.value = '';
    }

    function applyLrcPaste(mode){
        const st = lrcEditorState;
        if(!st.el) return;
        const area = st.el.querySelector('#lrc-paste-area');
        const rows = lrcParseToRows(area ? area.value : '');
        if(!rows.length){
            showNotification('Вставьте текст песни — хотя бы одну непустую строку');
            return;
        }

        const hasContent = st.rows.some(r => String(r.text || '').trim() || r.time > 0);
        if(mode === 'replace' || !hasContent){
            st.rows = rows;
            st.selected = 0;
        } else {
            // хвостовую пустую строку заменяем вставленным текстом
            while(st.rows.length && !String(st.rows[st.rows.length - 1].text || '').trim()
                && st.rows[st.rows.length - 1].time <= 0){
                st.rows.pop();
            }
            st.selected = st.rows.length;
            st.rows = st.rows.concat(rows);
        }

        closeLrcPaste();
        renderLrcRows();
        markLrcDirty();
        selectLrcRow(st.selected);
        const hasTimes = st.rows.some(r => r.time > 0);
        updateLrcStatus(
            'текст добавлен: ' + rows.length + ' ' + lrcPluralLines(rows.length)
            + (hasTimes ? '' : ' · «Раскидать» расставит время')
        );
    }

    // многострочная вставка прямо в строку (из буфера обмена)
    function insertLrcRows(index, rows){
        const st = lrcEditorState;
        if(!rows.length) return;
        const target = st.rows[index];
        const replaceTarget = target && !String(target.text || '').trim();
        const targetTime = target && target.time > 0.0001 ? target.time : 0;

        if(replaceTarget){
            st.rows.splice(index, 1, ...rows);
            st.selected = index;
        } else {
            st.rows.splice(index + 1, 0, ...rows);
            st.selected = index + 1;
        }

        // строка была с временем — первая вставленная его наследует
        if(targetTime > 0 && rows[0].time <= 0.0001) rows[0].time = targetTime;

        renderLrcRows();
        markLrcDirty();
        selectLrcRow(st.selected);
        updateLrcStatus('вставлено строк: ' + rows.length);
    }

    function onLrcRowPaste(e, index){
        const text = e.clipboardData ? e.clipboardData.getData('text') : '';
        if(!text) return;
        const multiline = /[\r\n]/.test(text);
        const timed = /\[\d{1,3}:\d{1,2}(?:\.\d+)?\]/.test(text);
        if(!multiline && !timed) return;   // обычная вставка одного слова

        const rows = lrcParseToRows(text);
        if(!rows.length) return;
        e.preventDefault();
        insertLrcRows(index, rows);
    }

    // ══════════════════════════════════════════════════════
    //  РАСКЛАДКА ТЕКСТА ПО ВРЕМЕНИ
    //  Строки без времени раскладываются равномерно между
    //  размеченными соседями (или от начала до конца трека).
    // ══════════════════════════════════════════════════════
    function spreadLrcTimes(){
        const st = lrcEditorState;
        if(!st.rows.length){
            updateLrcStatus('нет строк');
            return;
        }

        const duration = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
        let changed = 0;
        let i = 0;

        while(i < st.rows.length){
            if(st.rows[i].time > 0.0001){ i++; continue; }

            let end = i;
            while(end < st.rows.length && st.rows[end].time <= 0.0001) end++;
            const count = end - i;
            const start = i > 0 ? st.rows[i - 1].time : 0;

            let finish = end < st.rows.length ? st.rows[end].time : duration;
            if(!(finish > start)) finish = start + Math.max(3, count * 3);

            // пустые строки-разрывы должны занимать меньше времени,
            // чем строки с текстом, иначе между куплетами повисает пауза
            const weights = [];
            let total = 0;
            for(let k = 0; k < count; k++){
                const weight = String(st.rows[i + k].text || '').trim() ? 1 : 0.25;
                weights.push(weight);
                total += weight;
            }

            // в конце блока оставляем один «шаг» до следующей размеченной строки
            const step = (finish - start) / (total + 1);
            let acc = 0;
            for(let k = 0; k < count; k++){
                acc += weights[k];
                st.rows[i + k].time = Math.round((start + step * acc) * 100) / 100;
                changed++;
            }
            i = end;
        }

        if(!changed){
            updateLrcStatus('у всех строк уже есть время');
            return;
        }

        // обновляем поля времени без перерисовки списка
        st.rows.forEach(row => {
            const input = row.el && row.el.querySelector('.lrc-time');
            if(input){
                input.value = lrcFormatTime(row.time);
                input.classList.remove('invalid');
            }
        });
        markLrcDirty();
        updateLrcStatus('время распределено: ' + changed + ' ' + lrcPluralLines(changed));
    }

    function markLrcDirty(){
        lrcEditorState.dirty = true;
        updateLrcStatus();
    }

    function updateLrcStatus(custom){
        const st = lrcEditorState;
        if(!st.el) return;
        const el = st.el.querySelector('#lrc-status');
        if(!el) return;

        const total = st.rows.length;
        const timed = st.rows.filter(r => r.time > 0).length;
        const empty = st.rows.filter(r => !String(r.text || '').trim()).length;
        const base = custom || (total
            ? total + ' ' + lrcPluralLines(total)
                + (timed ? ' · со временем ' + timed : ' · без таймингов')
                + (empty ? ' · пустых ' + empty : '')
            : 'нет строк');

        el.textContent = st.dirty ? base + ' · не сохранено' : base;
        el.classList.toggle('dirty', st.dirty);
        el.classList.remove('saved');
    }

    function updateLrcTransport(){
        const st = lrcEditorState;
        if(!st.el || !st.el.classList.contains('open')) return;

        const now = isFinite(audio.currentTime) ? audio.currentTime : 0;
        const duration = isFinite(audio.duration) ? audio.duration : 0;

        st.el.querySelector('#lrc-time-now').textContent = formatTime(now);
        st.el.querySelector('#lrc-time-dur').textContent = duration ? formatTime(duration) : '—';

        const seek = st.el.querySelector('#lrc-seek');
        if(document.activeElement !== seek){
            seek.value = duration ? String(Math.round(now / duration * 1000)) : '0';
        }

        st.el.querySelector('#lrc-play').textContent = audio.paused ? '▶' : '❚❚';

        // подсветка строки, которая звучит сейчас
        let currentIndex = -1;
        let currentTime = -Infinity;
        st.rows.forEach((row, i) => {
            if(row.time <= now + 0.05 && row.time >= currentTime){
                currentIndex = i;
                currentTime = row.time;
            }
        });
        st.rows.forEach((row, i) => {
            if(row.el) row.el.classList.toggle('is-current', i === currentIndex);
        });
    }

    async function onLrcSaveClick(){
        const st = lrcEditorState;
        const file = st.file;
        if(!file || !st.el) return;

        const cb = st.el.querySelector('#lrc-write-disk');
        const wantDisk = !!currentDirHandle && !!cb && cb.checked && !cb.disabled;

        // разрешение спрашиваем первым действием, пока живёт жест пользователя
        let diskPermission = null;
        if(wantDisk){
            try {
                diskPermission = await currentDirHandle.requestPermission({ mode: 'readwrite' });
            } catch(_) {
                diskPermission = 'denied';
            }
        }

        const lrcText = lrcSerializeRows(st.rows, file);
        const saved = await saveLyricsEdit(lyricsKeyFor(file), lrcText, file.lyricsOriginal || null);
        if(!saved){
            showNotification('Не удалось сохранить правку');
            return;
        }

        file.lyricsEdited = lrcText;
        if(tracks[currentTrackGlobalIndex] === file) applyLyrics(file, lrcText, 'edit');

        let note = 'Тайминги сохранены в приложении';
        if(wantDisk && diskPermission === 'granted'){
            try {
                const written = await writeLrcToDisk(file, lrcText);
                note = written.ok
                    ? 'Тайминги сохранены · ' + written.name
                    : 'Тайминги сохранены в приложении · .lrc не записан';
            } catch(e){
                console.warn('writeLrcToDisk:', e);
                note = 'Тайминги сохранены в приложении · .lrc не записан';
            }
        }

        closeLrcEditor({ force: true });
        showNotification(note);
    }

    async function writeLrcToDisk(file, lrcText){
        const rootHandle = currentDirHandle;
        if(!rootHandle) return { ok: false };

        const raw = String(file._path || file.webkitRelativePath || file.name).replace(/\\/g, '/');
        const parts = raw.split('/').filter(Boolean);
        if(parts.length > 1) parts.shift();   // имя корневой папки
        parts.pop();                          // имя самого трека

        let dir = rootHandle;
        for(const part of parts){
            dir = await dir.getDirectoryHandle(part);
        }

        const lrcName = file.name.replace(/\.[^/.]+$/, '') + '.lrc';
        const handle = await dir.getFileHandle(lrcName, { create: true });
        const writable = await handle.createWritable();
        await writable.write(lrcText);
        await writable.close();

        // чтобы синхронизация и повторное открытие видели уже новый текст
        file.lrcFile = new File([lrcText], lrcName, { type: 'text/plain' });

        return { ok: true, name: lrcName };
    }

    function getFilteredIndex() {

    function playNext(opts = {}) {
        if (waveMode) {
            // если пользователь отматывал назад — сначала идём вперёд по истории
            if (!opts.ignoreForward) {
                const fwd = RecoEngine.goForward();
                if (fwd) return playTrack(fwd, { fromHistory: true });
            }
            // иначе берём следующий трек из очереди (она уже добита до 5)
            const next = RecoEngine.popNext();
            if (next) return playTrack(next);
        }
        const fi = getFilteredIndex();
        if (fi !== -1 && fi + 1 < filteredTracks.length) playTrack(filteredTracks[fi + 1]);
    }

        if (waveMode) {
            const prev = RecoEngine.goBack();
            if (prev) return playTrack(prev, { fromHistory: true });
        }
        const fi = getFilteredIndex();
        if (fi > 0) playTrack(filteredTracks[fi - 1]);
    });

    });

    renderVote(); // первичная отрисовка

    // ══════════════════════════════════════════════════════
    //  LIKE / DISLIKE ANIMATION
    // ══════════════════════════════════════════════════════
    const HEART_MINI_SVG = `<svg viewBox="0 0 16 16"><path d="M8 14.25c-.2 0-.4-.07-.55-.2C4.1 11.15 2 8.9 2 6.3 2 4.35 3.5 2.9 5.4 2.9c1.1 0 2 .55 2.6 1.4.6-.85 1.5-1.4 2.6-1.4C12.5 2.9 14 4.35 14 6.3c0 2.6-2.1 4.85-5.45 7.75-.15.13-.35.2-.55.2z" fill="currentColor"/></svg>`;

    function burstHearts(button, count = 8, mode = 'like') {
        const layer = document.createElement('div');
        layer.className = 'like-particles';
        button.appendChild(layer);

        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'like-particle' + (mode === 'dislike' ? ' dislike-particle' : '');
            p.innerHTML = HEART_MINI_SVG;

            // Разлёт по кругу для лайка, вниз — для дизлайка
            let angle, radius, rot;
            if (mode === 'like') {
                angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
                radius = 35 + Math.random() * 30;
            } else {
                // вниз и немного в стороны
                angle = Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.9;
                radius = 40 + Math.random() * 25;
            }
            const tx = Math.cos(angle) * radius;
            const ty = Math.sin(angle) * radius;
            rot = (Math.random() - 0.5) * 180;

            p.style.setProperty('--tx', tx + 'px');
            p.style.setProperty('--ty', ty + 'px');
            p.style.setProperty('--rot', rot + 'deg');
            p.style.animationDelay = (i * 25) + 'ms';
            p.style.fontSize = (8 + Math.random() * 6) + 'px';
            p.style.width = p.style.height = (10 + Math.random() * 6) + 'px';

            layer.appendChild(p);
            p.addEventListener('animationend', () => p.remove(), { once: true });
        }

        // Кольцо — только при лайке
        if (mode === 'like') {
            const ring = document.createElement('div');
            ring.className = 'like-ring';
            button.appendChild(ring);
            ring.addEventListener('animationend', () => ring.remove(), { once: true });
        }

        // Убираем контейнер, когда все частицы догорели
        setTimeout(() => layer.remove(), 1400);
    }

    function animateVote(button, mode) {
        if (mode === 'like') {
            button.classList.remove('like-pop');
            void button.offsetWidth;   // форс reflow
            button.classList.add('like-pop');
            burstHearts(button, 10, 'like');
        } else if (mode === 'dislike') {
            button.classList.remove('dislike-shake');
            void button.offsetWidth;
            button.classList.add('dislike-shake');
            burstHearts(button, 6, 'dislike');
        }
    }
</script>
